services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "8081:8081"
    depends_on:
      - db
    networks: [backend]

  db:
    image: postgres:16
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]

  adminer:
    image: adminer
    restart: always
    ports:
      - "8082:8080"
    networks: [backend]

networks:
  backend:

volumes:
  pgdata:
