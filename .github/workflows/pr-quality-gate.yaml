name: PR Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - staging
      - main

jobs:
  lint:
    name: Code and Dockerfile Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Generate Wire Code
        run: |
          go install github.com/google/wire/cmd/wire@latest
          cd internal/wire && $(go env GOPATH)/bin/wire

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=10m

      - name: Run Hadolint (Dockerfile linter)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better secret detection

      - name: Run Trivy (Vulnerability Scanning)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    outputs:
      coverage_current: ${{ steps.current_coverage.outputs.coverage }}
      coverage_baseline: ${{ steps.baseline_coverage.outputs.baseline }}
      coverage_diff: ${{ steps.coverage_check.outputs.diff_formatted }}
      coverage_status: ${{ steps.coverage_check.outputs.status }}
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Generate Wire Code
        run: |
          go install github.com/google/wire/cmd/wire@latest
          cd internal/wire && $(go env GOPATH)/bin/wire

      - name: Run unit tests
        env:
          # Redis configuration for tests that need it
          REDIS_URL: redis://localhost:6379
        run: |
          # Run tests excluding integration tests (those require database migrations)
          # Integration tests can be run locally with: RUN_REPOSITORY_INTEGRATION=1 go test ./...

          # Retry up to 3 times on test failure
          MAX_ATTEMPTS=3
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Test attempt $ATTEMPT of $MAX_ATTEMPTS..."

            # Skip integration tests - don't set DATABASE_URL or RUN_REPOSITORY_INTEGRATION
            if go test -v -race -coverprofile=coverage.out ./...; then
              echo "✅ Tests passed on attempt $ATTEMPT"
              exit 0
            else
              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                echo "⚠️ Tests failed on attempt $ATTEMPT, retrying..."
                ATTEMPT=$((ATTEMPT + 1))
                sleep 2
              else
                echo "❌ Tests failed after $MAX_ATTEMPTS attempts"
                exit 1
              fi
            fi
          done

      - name: Generate coverage report
        run: go tool cover -func=coverage.out

      - name: Extract current coverage
        id: current_coverage
        run: |
          COVERAGE=$(./scripts/extract-coverage.sh)
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Current PR coverage: $COVERAGE%"

      - name: Download baseline coverage from gh-pages
        id: baseline_coverage
        run: |
          # Try to fetch baseline from gh-pages branch, default to 0% if not found
          BASELINE=$(curl -s https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/coverage-baseline.txt || echo "0.0")

          # Validate it's a number
          if ! [[ "$BASELINE" =~ ^[0-9]+\.?[0-9]*$ ]]; then
            echo "Warning: Invalid baseline '$BASELINE', using 0.0"
            BASELINE="0.0"
          fi

          echo "baseline=$BASELINE" >> $GITHUB_OUTPUT
          echo "Baseline coverage from main: $BASELINE%"

      - name: Compare coverage
        id: coverage_check
        run: |
          CURRENT="${{ steps.current_coverage.outputs.coverage }}"
          BASELINE="${{ steps.baseline_coverage.outputs.baseline }}"
          TOLERANCE="0.1"  # Allow 0.1% decrease due to race flag randomness

          # Calculate difference
          DIFF=$(echo "$CURRENT - $BASELINE" | bc -l)

          # Format difference with sign
          if (( $(echo "$DIFF >= 0" | bc -l) )); then
            DIFF_FORMATTED="+${DIFF}"
            STATUS="✅"
          else
            DIFF_FORMATTED="${DIFF}"
            # Check if within tolerance
            if (( $(echo "$DIFF >= -$TOLERANCE" | bc -l) )); then
              STATUS="✅"
            else
              STATUS="❌"
            fi
          fi

          echo "diff=$DIFF" >> $GITHUB_OUTPUT
          echo "diff_formatted=$DIFF_FORMATTED" >> $GITHUB_OUTPUT
          echo "status=$STATUS" >> $GITHUB_OUTPUT

          echo "Coverage comparison:"
          echo "  Baseline (main): $BASELINE%"
          echo "  Current (PR):    $CURRENT%"
          echo "  Difference:      $DIFF_FORMATTED%"
          echo "  Tolerance:       ±${TOLERANCE}%"

          # Fail if coverage decreased beyond tolerance
          if (( $(echo "$DIFF < -$TOLERANCE" | bc -l) )); then
            echo "❌ Coverage decreased by ${DIFF#-}% (beyond tolerance of ${TOLERANCE}%)"
            echo "::error::Coverage decreased from $BASELINE% to $CURRENT% (${DIFF_FORMATTED}%). Allowed tolerance: ±${TOLERANCE}%"
            exit 1
          elif (( $(echo "$DIFF < 0" | bc -l) )); then
            echo "⚠️ Coverage decreased by ${DIFF#-}% (within tolerance of ${TOLERANCE}%)"
            echo "✅ Coverage check passed (within tolerance)"
          else
            echo "✅ Coverage maintained or improved"
          fi

      - name: Generate coverage summary
        if: always()
        run: |
          echo "## 📊 Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Baseline (main)** | ${{ steps.baseline_coverage.outputs.baseline }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| **Current (PR)** | ${{ steps.current_coverage.outputs.coverage }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| **Difference** | ${{ steps.coverage_check.outputs.diff_formatted }}% ${{ steps.coverage_check.outputs.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if (( $(echo "${{ steps.coverage_check.outputs.diff }} >= 0" | bc -l) )); then
            echo "✅ **Coverage check passed** - Coverage maintained or improved" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Coverage check failed** - Coverage decreased" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  build:
    name: Docker Build Dry Run
    runs-on: ubuntu-latest
    needs: [lint, security-scan, test]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Generate Wire Code
        run: |
          go install github.com/google/wire/cmd/wire@latest
          cd internal/wire && $(go env GOPATH)/bin/wire

      - name: Install swag
        run: |
          mkdir -p bin
          GOBIN="$PWD/bin" go install github.com/swaggo/swag/cmd/swag@latest
          echo "$PWD/bin" >> $GITHUB_PATH

      - name: Generate Swagger documentation
        run: swag init -g cmd/server/main.go

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (dry run)
        run: |
          VERSION=$(git rev-parse --short HEAD)
          docker buildx build \
            --platform linux/amd64 \
            --build-arg VERSION=$VERSION \
            --tag ghcr.io/${{ github.repository_owner }}/app-go-api:pr-${{ github.event.pull_request.number }} \
            --load \
            .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/app-go-api:pr-${{ github.event.pull_request.number }}'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy image scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'

  summary:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    needs: [lint, security-scan, test, build]
    if: always()
    permissions:
      pull-requests: write
    steps:
      - name: Find previous quality gate comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '🚦 PR Quality Gate Results'

      - name: Create or update PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## 🚦 PR Quality Gate Results

            | Check | Status |
            |-------|--------|
            | Code Linting | ${{ needs.lint.result == 'success' && '✅ Passed' || needs.lint.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |
            | Security Scanning | ${{ needs.security-scan.result == 'success' && '✅ Passed' || needs.security-scan.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |
            | Unit Tests | ${{ needs.test.result == 'success' && '✅ Passed' || needs.test.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |
            | **Coverage** | **${{ needs.test.outputs.coverage_current }}%** (${{ needs.test.outputs.coverage_diff }}%) ${{ needs.test.outputs.coverage_status }} |
            | Docker Build | ${{ needs.build.result == 'success' && '✅ Passed' || needs.build.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |

            ### 📊 Coverage Details
            - **Baseline (main)**: ${{ needs.test.outputs.coverage_baseline }}%
            - **This PR**: ${{ needs.test.outputs.coverage_current }}%
            - **Change**: ${{ needs.test.outputs.coverage_diff }}% ${{ needs.test.outputs.coverage_status }}

            ---

            ${{ needs.lint.result == 'success' && needs.security-scan.result == 'success' && needs.test.result == 'success' && needs.build.result == 'success' && '### ✅ All quality checks passed - PR is ready to merge' || '### ❌ Quality gate failed - PR is not ready to merge' }}

            **Commit**: ${{ github.event.pull_request.head.sha }}
            **Run**: [View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Fail workflow if any check failed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.security-scan.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            exit 1
          fi
