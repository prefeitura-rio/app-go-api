name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    name: Build and publish docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run tests with coverage
        env:
          REDIS_URL: redis://localhost:6379
        run: |
          MAX_ATTEMPTS=3
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            if go test -race -coverprofile=coverage.out -timeout=5m ./...; then
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            [ $ATTEMPT -le $MAX_ATTEMPTS ] && sleep 2 || exit 1
          done

      - name: Extract coverage
        id: coverage
        run: |
          COVERAGE=$(./scripts/extract-coverage.sh)
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE%"

      - name: Build static site
        env:
          COVERAGE: ${{ steps.coverage.outputs.coverage }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          SITE=/tmp/site
          mkdir -p $SITE/coverage $SITE/swagger

          # Prevent Jekyll processing
          touch $SITE/.nojekyll

          # Coverage HTML report (standalone, no external deps)
          go tool cover -html=coverage.out -o $SITE/coverage/index.html

          # OpenAPI spec
          cp docs/openapi-v3.json $SITE/swagger/openapi.json

          # Swagger UI (CDN)
          cat > $SITE/swagger/index.html << 'SWAGGER'
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>API Go — Prefeitura Rio</title>
            <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
            <style>
              body { margin: 0; }
              .topbar { display: none; }
            </style>
          </head>
          <body>
            <div id="swagger-ui"></div>
            <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
            <script>
              SwaggerUIBundle({
                url: "./openapi.json",
                dom_id: '#swagger-ui',
                presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
                layout: "BaseLayout",
                deepLinking: true,
                tryItOutEnabled: true,
              });
            </script>
          </body>
          </html>
          SWAGGER

          # Coverage badge JSON (Shields.io endpoint format)
          COLOR="red"
          if (( $(echo "$COVERAGE >= 80" | bc -l) )); then COLOR="brightgreen"
          elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then COLOR="yellow"
          elif (( $(echo "$COVERAGE >= 40" | bc -l) )); then COLOR="orange"
          fi

          cat > $SITE/coverage-badge.json << EOF
          {
            "schemaVersion": 1,
            "label": "coverage",
            "message": "${COVERAGE}%",
            "color": "${COLOR}"
          }
          EOF

          # Baseline for pr-quality-gate.yaml (keeps CI working)
          echo "$COVERAGE" > $SITE/coverage-baseline.txt
          echo "Last updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > $SITE/coverage-updated.txt
          echo "Commit: $SHA" >> $SITE/coverage-updated.txt

          # Landing page
          SHORT_SHA="${SHA:0:7}"
          DATE="$(date -u '+%d/%m/%Y %H:%M UTC')"
          cat > $SITE/index.html << EOF
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>API Go — Prefeitura Rio</title>
            <style>
              *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                background: #f5f5f7;
                color: #1d1d1f;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
              }
              header {
                background: #0d3b66;
                color: white;
                padding: 2rem;
                text-align: center;
              }
              header h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -.5px; }
              header p { margin-top: .5rem; opacity: .8; font-size: .95rem; }
              main {
                flex: 1;
                max-width: 860px;
                width: 100%;
                margin: 2.5rem auto;
                padding: 0 1.5rem;
              }
              .grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                gap: 1.25rem;
              }
              .card {
                background: white;
                border-radius: 12px;
                padding: 1.75rem;
                text-decoration: none;
                color: inherit;
                box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.05);
                transition: box-shadow .2s, transform .2s;
                display: flex;
                flex-direction: column;
                gap: .75rem;
              }
              .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.12); transform: translateY(-2px); }
              .card-icon { font-size: 2rem; }
              .card-title { font-size: 1.1rem; font-weight: 600; }
              .card-desc { font-size: .9rem; color: #6e6e73; line-height: 1.5; }
              .badge {
                display: inline-flex;
                align-items: center;
                gap: .4rem;
                background: #f0f7ff;
                color: #0d3b66;
                border-radius: 20px;
                padding: .3rem .8rem;
                font-size: .8rem;
                font-weight: 600;
                margin-top: auto;
              }
              footer {
                text-align: center;
                padding: 1.5rem;
                font-size: .8rem;
                color: #8e8e93;
              }
              footer a { color: #0d3b66; text-decoration: none; }
            </style>
          </head>
          <body>
            <header>
              <h1>API Go — Prefeitura Rio</h1>
              <p>Documentação técnica gerada automaticamente a partir do branch <code>main</code></p>
            </header>
            <main>
              <div class="grid">
                <a class="card" href="./swagger/">
                  <div class="card-icon">📋</div>
                  <div class="card-title">Documentação da API</div>
                  <div class="card-desc">Endpoints, schemas e exemplos de request/response. Gerado a partir do OpenAPI 3.0.</div>
                  <span class="badge">Swagger UI</span>
                </a>
                <a class="card" href="./coverage/">
                  <div class="card-icon">🧪</div>
                  <div class="card-title">Relatório de Cobertura</div>
                  <div class="card-desc">Cobertura de testes por arquivo e linha. Cobertura atual: <strong>${COVERAGE}%</strong></div>
                  <span class="badge">Go Coverage</span>
                </a>
              </div>
            </main>
            <footer>
              Commit <a href="https://github.com/${REPO}/commit/${SHA}">${SHORT_SHA}</a> &mdash; ${DATE}
            </footer>
          </body>
          </html>
          EOF

      - name: Deploy to gh-pages
        run: |
          cd /tmp/site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "docs: publish site from ${{ github.sha }}"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:gh-pages

      - name: Summary
        run: |
          echo "## Docs published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Coverage**: ${{ steps.coverage.outputs.coverage }}%" >> $GITHUB_STEP_SUMMARY
          echo "- **Site**: https://prefeitura-rio.github.io/app-go-api/" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
