name: Deploy to Staging with Blue-Green

on:
  push:
    branches:
      - main

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write
      packages: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if k8s-only changes
        id: check-k8s-only
        run: |
          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})

          # Check if only k8s/ files were changed
          NON_K8S_FILES=$(echo "$CHANGED_FILES" | grep -v "^k8s/" || true)

          if [ -z "$NON_K8S_FILES" ] && [ -n "$CHANGED_FILES" ]; then
            echo "k8s_only=true" >> $GITHUB_OUTPUT
            echo "Only k8s/ files changed, skipping build and tests"
          else
            echo "k8s_only=false" >> $GITHUB_OUTPUT
            echo "Non-k8s files changed, proceeding with build and tests"
          fi

      - name: Set up Go
        if: steps.check-k8s-only.outputs.k8s_only != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install swag
        if: steps.check-k8s-only.outputs.k8s_only != 'true'
        run: |
          mkdir -p bin
          GOBIN="$PWD/bin" go install github.com/swaggo/swag/cmd/swag@latest
          echo "$PWD/bin" >> $GITHUB_PATH

      - name: Generate Swagger documentation
        if: steps.check-k8s-only.outputs.k8s_only != 'true'
        run: swag init -g cmd/server/main.go

      - name: Set up Docker Buildx
        if: steps.check-k8s-only.outputs.k8s_only != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.check-k8s-only.outputs.k8s_only != 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

      - name: Extract metadata for Docker
        if: steps.check-k8s-only.outputs.k8s_only != 'true'
        id: meta
        run: |
          COMMIT_HASH=${{ github.sha }}
          SHORT_HASH=$(git rev-parse --short HEAD)
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/app-go-api"

          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
          echo "SHORT_HASH=$SHORT_HASH" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        if: steps.check-k8s-only.outputs.k8s_only != 'true'
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg VERSION=$SHORT_HASH \
            --tag $IMAGE_NAME:latest \
            --tag $IMAGE_NAME:$COMMIT_HASH \
            --push .

      - name: Get image digest
        if: steps.check-k8s-only.outputs.k8s_only != 'true'
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect $IMAGE_NAME:latest --format '{{.Manifest.Digest}}' | grep -oE 'sha256:[a-f0-9]+' | head -n1)
          echo "DIGEST=$DIGEST" >> $GITHUB_ENV
          echo "Image digest: $DIGEST"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Install gke-gcloud-auth-plugin
        run: gcloud components install gke-gcloud-auth-plugin

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Install Argo Rollouts kubectl plugin
        run: |
          curl -fLO https://github.com/argoproj/argo-rollouts/releases/latest/download/kubectl-argo-rollouts-linux-amd64
          chmod +x ./kubectl-argo-rollouts-linux-amd64
          sudo mv ./kubectl-argo-rollouts-linux-amd64 /usr/local/bin/kubectl-argo-rollouts

      - name: Configure kubectl for GKE
        run: gcloud container clusters get-credentials application --zone=us-central1 --project="${{ vars.GCP_PROJECT_ID }}"

      - name: Update ArgoCD Application image override
        if: steps.check-k8s-only.outputs.k8s_only != 'true'
        run: |
          echo "Updating ArgoCD Application image override..."
          echo "Image: $IMAGE_NAME:$COMMIT_HASH@$DIGEST"

          # Update the Kustomize image override in ArgoCD Application
          kubectl patch application go -n argocd --type=json \
            -p="[{\"op\": \"replace\", \"path\": \"/spec/source/kustomize/images/0\", \"value\": \"$IMAGE_NAME:$COMMIT_HASH@$DIGEST\"}]"

          echo "✅ ArgoCD Application updated with new image override"

      - name: Wait for ArgoCD sync and blue-green preview
        if: steps.check-k8s-only.outputs.k8s_only != 'true'
        timeout-minutes: 5
        run: |
          echo "Waiting for ArgoCD to sync and create blue-green preview..."
          echo "Expected image: $IMAGE_NAME:$COMMIT_HASH@$DIGEST"

          # Wait for the rollout spec to be updated with the new image
          for i in {1..60}; do
            CURRENT_IMAGE=$(kubectl get rollout go -n go -o jsonpath='{.spec.template.spec.containers[0].image}')
            SYNC_STATUS=$(kubectl get application go -n argocd -o jsonpath='{.status.sync.status}')

            echo "Attempt $i/60: Image=$CURRENT_IMAGE, ArgoCD Sync=$SYNC_STATUS"

            if [[ "$CURRENT_IMAGE" == "$IMAGE_NAME:$COMMIT_HASH@$DIGEST" ]]; then
              echo "✅ Rollout spec updated with new image!"
              break
            fi

            if [ $i -eq 60 ]; then
              echo "❌ Timeout waiting for rollout image update"
              echo "Expected: $IMAGE_NAME:$COMMIT_HASH@$DIGEST"
              echo "Got: $CURRENT_IMAGE"
              echo ""
              echo "ArgoCD Application status:"
              kubectl get application go -n argocd -o yaml
              echo ""
              echo "Rollout status:"
              kubectl get rollout go -n go -o yaml
              exit 1
            fi

            sleep 5
          done

          # Wait for Argo Rollouts to create the preview
          echo "Waiting for blue-green preview to be created..."
          sleep 5

          # Check rollout status
          kubectl argo rollouts get rollout go -n go

      - name: Set up port forward to preview service
        if: steps.check-k8s-only.outputs.k8s_only != 'true'
        run: |
          echo "Waiting for preview pods to be fully ready..."
          # Get the preview replicaset hash from rollout status
          PREVIEW_RS=$(kubectl argo rollouts status go -n go --timeout=2m | grep -oP 'Revision \d+.*deployed' | awk '{print $2}' | head -1)
          if [ -z "$PREVIEW_RS" ]; then
            echo "Failed to detect preview replicaset"
            exit 1
          fi

          # Wait for preview pods to be ready (2/2 containers)
          echo "Waiting for preview pods to become ready..."
          kubectl wait --for=condition=ready pod -l app=go -n go --timeout=3m

          echo "Setting up port forward to preview service..."
          # Start port-forward in background
          kubectl port-forward -n go service/go-preview 8080:80 &
          PORT_FORWARD_PID=$!
          echo "PORT_FORWARD_PID=$PORT_FORWARD_PID" >> $GITHUB_ENV

          # Wait for port-forward to be ready
          echo "Waiting for port-forward to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/health > /dev/null 2>&1; then
              echo "Port-forward is ready!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Port-forward failed to become ready"
              kill $PORT_FORWARD_PID 2>/dev/null || true
              exit 1
            fi
            echo "Attempt $i/30: Waiting for port-forward..."
            sleep 2
          done

      - name: Run smoke tests against preview
        if: steps.check-k8s-only.outputs.k8s_only != 'true'
        run: |
          echo "Running smoke tests against preview service..."

          # Health check
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Health check failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✅ Health check passed"

          # Swagger docs check
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/swagger/index.html)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Swagger docs check failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✅ Swagger docs available"

          echo "✅ All smoke tests passed!"

      - name: Clean up port forward
        if: steps.check-k8s-only.outputs.k8s_only != 'true' && always()
        run: |
          echo "Cleaning up port-forward..."
          kill $PORT_FORWARD_PID 2>/dev/null || true

      - name: Promote to Stable
        if: steps.check-k8s-only.outputs.k8s_only != 'true' && success()
        run: |
          echo "✅ Tests passed! Promoting to stable..."

          # Promote preview to active (stable)
          kubectl argo rollouts promote go -n go

          # Wait for promotion to complete
          kubectl argo rollouts status go -n go --timeout=5m

      - name: Rollback on Failure
        if: steps.check-k8s-only.outputs.k8s_only != 'true' && failure()
        run: |
          echo "❌ Tests failed! Aborting rollout..."

          # Abort the rollout (keeps stable service unchanged)
          kubectl argo rollouts abort go -n go

          echo "Rollout aborted. Preview discarded. Stable service unchanged."
          exit 1

      - name: Create deployment summary
        if: always() && steps.check-k8s-only.outputs.k8s_only != 'true'
        run: |
          echo "## 🚀 Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: $SHORT_HASH" >> $GITHUB_STEP_SUMMARY
          echo "**Image**: \`$IMAGE_NAME:$COMMIT_HASH@${DIGEST:0:12}...\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" = "success" ]; then
            echo "### ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
            echo "- Smoke tests passed" >> $GITHUB_STEP_SUMMARY
            echo "- Promoted to active service" >> $GITHUB_STEP_SUMMARY
            echo "- Blue-green rollout complete" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "- Smoke tests failed" >> $GITHUB_STEP_SUMMARY
            echo "- Rollout aborted" >> $GITHUB_STEP_SUMMARY
            echo "- Active service unchanged" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Send Discord notification
        if: always() && steps.check-k8s-only.outputs.k8s_only != 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Discord webhook not configured, skipping notification"
            exit 0
          fi

          # Get commit info
          COMMIT_MSG=$(git log -1 --pretty=format:'%s' ${{ github.sha }})
          COMMIT_AUTHOR=$(git log -1 --pretty=format:'%an' ${{ github.sha }})
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"

          # Determine status and color
          if [ "${{ job.status }}" = "success" ]; then
            STATUS_EMOJI="✅"
            STATUS_TEXT="Succeeded"
            COLOR="3066993"  # Green
            DESCRIPTION="Smoke tests passed and deployment promoted to active service. Blue-green rollout complete."
          else
            STATUS_EMOJI="❌"
            STATUS_TEXT="Failed"
            COLOR="15158332"  # Red
            DESCRIPTION="Smoke tests failed. Rollout aborted. Active service unchanged."
          fi

          # Create Discord embed
          DISCORD_PAYLOAD=$(cat <<EOF
          {
            "embeds": [{
              "title": "${STATUS_EMOJI} Staging Deployment ${STATUS_TEXT}",
              "description": "${DESCRIPTION}",
              "color": ${COLOR},
              "fields": [
                {
                  "name": "📝 Commit",
                  "value": "[${COMMIT_MSG:0:50}](${COMMIT_URL})",
                  "inline": false
                },
                {
                  "name": "👤 Author",
                  "value": "${COMMIT_AUTHOR}",
                  "inline": true
                },
                {
                  "name": "🔖 Version",
                  "value": "\`${SHORT_HASH}\`",
                  "inline": true
                },
                {
                  "name": "🐳 Image",
                  "value": "\`${IMAGE_NAME}:${COMMIT_HASH}\`",
                  "inline": false
                }
              ],
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)",
              "footer": {
                "text": "GitHub Actions"
              }
            }]
          }
          EOF
          )

          # Send to Discord
          curl -H "Content-Type: application/json" \
               -d "$DISCORD_PAYLOAD" \
               "$DISCORD_WEBHOOK"
