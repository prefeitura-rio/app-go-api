---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: go
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: go
  strategy:
    blueGreen:
      activeService: go
      previewService: go-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
      previewReplicaCount: 1
  template:
    metadata:
      labels:
        app: go
      annotations:
        sidecar.istio.io/proxyCPU: "100m"
        sidecar.istio.io/proxyCPULimit: "1000m"
        sidecar.istio.io/proxyMemory: "1Gi"
        sidecar.istio.io/proxyMemoryLimit: "1536Mi"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: go
          image: ghcr.io/prefeitura-rio/app-go-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: TRACING_ENABLED
              value: "true"
            - name: TRACING_ENDPOINT
              value: "signoz-otel-collector.signoz.svc.cluster.local:4317"
            - name: TRACING_SERVICE_NAME
              value: "app-go-api"
            - name: TRACING_SERVICE_VERSION
              value: "v1.0.0"
          envFrom:
            - secretRef:
                name: go-secrets
          resources:
            requests:
              ephemeral-storage: 100Mi
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
      restartPolicy: Always
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: go-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: go
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: go-scaled-object
  annotations:
    autoscaling.keda.sh/trigger-authentication: "default"
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: go
  minReplicaCount: 3
  maxReplicaCount: 20
  cooldownPeriod: 30
  pollingInterval: 10
  fallback:
    failureThreshold: 3
    replicas: 1
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 60
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
            - type: Pods
              value: 2
              periodSeconds: 15
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 10
              periodSeconds: 60
            - type: Pods
              value: 1
              periodSeconds: 60
          selectPolicy: Max
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.istio-system.svc.cluster.local:9090
        metricName: http_requests_total
        threshold: "100"
        query: sum(rate(istio_requests_total{destination_workload="go"}[30s]))
        activationThreshold: "65"
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: go
  name: go
spec:
  ports:
    - name: "80"
      port: 80
      targetPort: 8080
  selector:
    app: go
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: go
  name: go-preview
spec:
  ports:
    - name: "80"
      port: 80
      targetPort: 8080
  selector:
    app: go
