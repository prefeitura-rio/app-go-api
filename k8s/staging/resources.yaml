---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-go-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-go-api
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: app-go-api
    spec:
      containers:
        - name: app-go-api
          image: ghcr.io/prefeitura-rio/app-go-api:latest
          ports:
            - containerPort: 80
          envFrom:
            - secretRef:
                name: app-go-api-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
      restartPolicy: Always

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: app-go-api
spec:
  selector:
    app: app-go-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP

---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-go-api
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: 'letsencrypt'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
spec:
  tls:
    - hosts:
        - app-go-api.staging.dados.rio
      secretName: app-go-api-tls
  rules:
    - host: app-go-api.staging.dados.rio
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-go-api
                port:
                  number: 80
