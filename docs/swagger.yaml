  /api/v1/courses:
    get:
      description: 'Retorna lista paginada de cursos. Sem status: exclui rascunhos.
        Com status: filtra pelos status informados (CSV). Derived statuses (scheduled,
        accepting_enrollments, in_progress, finished) são mapeados para published.'
      parameters:
      - description: 'Número da página (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Tamanho da página (default: 10)'
        in: query
        name: limit
        type: integer
      - description: 'Filtrar por status (CSV, ex: draft,published,in_review)'
        in: query
        name: status
        type: string
      - description: Filtrar por modalidade
        in: query
        name: modalidade
        type: string
      - description: Filtrar por organização (provedor do curso)
        in: query
        name: organization
        type: string
      - description: Buscar no título
        in: query
        name: search
        type: string
      - description: Filtrar por categoria
        in: query
        name: categoria_id
        type: integer
      - description: Filtrar por acessibilidade
        in: query
        name: acessibilidade_id
        type: integer
      - description: Filtrar por zona do bairro
        in: query
        name: neighborhood_zone
        type: string
      - description: 'Ordenação opcional. ''availability'': cursos com inscrição disponível
          primeiro; os sem inscrição (status final, prazo vencido ou vagas esgotadas
          — inclusive accepting_enrollments sem vagas) vão para o final. A ordenação
          é aplicada antes da paginação. Omitido = ordem padrão (id desc).'
        enum:
        - availability
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Listar cursos criados
      tags:
      - courses
