host: localhost:8081
info:
  contact:
    email: frederico.zolio@prefeitura.rio
    name: API Support
    url: https://iplan.rio
  description: API de serviços para aplicativos da Prefeitura do Rio
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: API Go
  version: "1.0"
paths:
  /api/v1/acessibilidades:
    get:
      description: Retorna uma lista paginada de acessibilidades
      parameters:
      - description: 'Número da página (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Tamanho da página (default: 10)'
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Listar acessibilidades
      tags:
      - acessibilidades
    post:
      consumes:
      - application/json
      description: Cria um novo tipo de acessibilidade
      parameters:
      - description: Dados da acessibilidade
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.Acessibilidade'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Acessibilidade'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Criar acessibilidade
      tags:
      - acessibilidades
  /api/v1/acessibilidades/{id}:
    delete:
      description: Remove uma acessibilidade pelo ID
      parameters:
      - description: ID da acessibilidade
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Excluir acessibilidade
      tags:
      - acessibilidades
    get:
      description: Retorna uma acessibilidade pelo seu ID
      parameters:
      - description: ID da acessibilidade
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Acessibilidade'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Obter acessibilidade por ID
      tags:
      - acessibilidades
    put:
      consumes:
      - application/json
      description: Atualiza os dados de uma acessibilidade existente
      parameters:
      - description: ID da acessibilidade
        in: path
        name: id
        required: true
        type: integer
      - description: Dados da acessibilidade
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.Acessibilidade'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Acessibilidade'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Atualizar acessibilidade
      tags:
      - acessibilidades
  /api/v1/categorias:
    get:
      description: Retorna uma lista paginada de categorias
      parameters:
      - description: 'Nu00famero da pu00e1gina (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Tamanho da pu00e1gina (default: 10)'
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Listar categorias
      tags:
      - categorias
    post:
      consumes:
      - application/json
      description: Cria uma nova categoria
      parameters:
      - description: Dados da categoria
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.Categoria'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Categoria'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Criar categoria
      tags:
      - categorias
  /api/v1/categorias/{id}:
    delete:
      description: Remove uma categoria pelo ID
      parameters:
      - description: ID da categoria
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Excluir categoria
      tags:
      - categorias
    get:
      description: Retorna uma categoria pelo seu ID
      parameters:
      - description: ID da categoria
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Categoria'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Obter categoria por ID
      tags:
      - categorias
    put:
      consumes:
      - application/json
      description: Atualiza os dados de uma categoria existente
      parameters:
      - description: ID da categoria
        in: path
        name: id
        required: true
        type: integer
      - description: Dados da categoria
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.Categoria'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Categoria'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Atualizar categoria
      tags:
      - categorias
  /api/v1/courses:
    get:
      description: 'Retorna lista paginada de cursos criados (status: "opened", "closed",
        "canceled")'
      parameters:
      - description: 'Número da página (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Tamanho da página (default: 10)'
        in: query
        name: limit
        type: integer
      - description: Filtrar por status
        in: query
        name: status
        type: string
      - description: Filtrar por modalidade
        in: query
        name: modalidade
        type: string
      - description: Filtrar por organização
        in: query
        name: organization
        type: string
      - description: Buscar no título
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Listar cursos criados
      tags:
      - courses
    post:
      consumes:
      - application/json
      description: 'Cria um novo curso no sistema (status: "opened")'
      parameters:
      - description: Dados do curso
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.Curso'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Criar curso
      tags:
      - courses
  /api/v1/courses/{courseId}:
    delete:
      description: Remove um curso pelo ID
      parameters:
      - description: ID do curso
        in: path
        name: courseId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Excluir curso
      tags:
      - courses
    get:
      description: Retorna dados completos de um curso específico
      parameters:
      - description: ID do curso
        in: path
        name: courseId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Curso'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Buscar curso específico
      tags:
      - courses
    put:
      consumes:
      - application/json
      description: Atualiza um curso existente. Também usado para publicar rascunhos
        mudando status de "draft" para "opened"
      parameters:
      - description: ID do curso
        in: path
        name: courseId
        required: true
        type: integer
      - description: Dados do curso
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.Curso'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
