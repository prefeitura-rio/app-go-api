  title: API Go
  version: "1.0"
paths:
  /api/v1/acessibilidades:
    get:
      description: Retorna uma lista paginada de acessibilidades
      parameters:
      - description: 'Número da página (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Tamanho da página (default: 10)'
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Listar acessibilidades
      tags:
      - acessibilidades
    post:
      consumes:
      - application/json
      description: Cria um novo tipo de acessibilidade
      parameters:
      - description: Dados da acessibilidade
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.Acessibilidade'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Acessibilidade'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Criar acessibilidade
      tags:
      - acessibilidades
  /api/v1/acessibilidades/{id}:
    delete:
      description: Remove uma acessibilidade pelo ID
      parameters:
      - description: ID da acessibilidade
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Excluir acessibilidade
      tags:
      - acessibilidades
    get:
      description: Retorna uma acessibilidade pelo seu ID
      parameters:
      - description: ID da acessibilidade
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Acessibilidade'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Obter acessibilidade por ID
      tags:
      - acessibilidades
    put:
      consumes:
      - application/json
      description: Atualiza os dados de uma acessibilidade existente
      parameters:
      - description: ID da acessibilidade
        in: path
        name: id
        required: true
        type: integer
      - description: Dados da acessibilidade
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.Acessibilidade'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Acessibilidade'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Atualizar acessibilidade
      tags:
      - acessibilidades
  /api/v1/admin/cnaes:
    post:
      consumes:
      - application/json
      description: Cria um novo CNAE (admin)
      parameters:
      - description: Dados do CNAE
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CNAE'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.CNAE'
        "400":
          description: Bad Request
