host: localhost:8081
info:
  contact:
    email: frederico.zolio@prefeitura.rio
    name: API Support
    url: https://iplan.rio
  description: API de serviços para aplicativos da Prefeitura do Rio
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: API Go
  version: "1.0"
paths:
  /api/public/courses:
    get:
      description: 'Retorna lista paginada de cursos públicos. Exclui rascunhos e
        cursos marcados como não visíveis publicamente (is_visible=false); estes continuam
        acessíveis por link direto via GET /api/public/courses/{id}. Com status: filtra
        pelos status informados (CSV). Derived statuses (scheduled, accepting_enrollments,
        in_progress, finished) são mapeados para published.'
      parameters:
      - description: 'Número da página (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Tamanho da página (default: 10)'
        in: query
        name: limit
        type: integer
      - description: 'Filtrar por status (CSV, ex: draft,published,in_review)'
        in: query
        name: status
        type: string
      - description: Filtrar por modalidade
        in: query
        name: modalidade
        type: string
      - description: Filtrar por organização (provedor do curso)
        in: query
        name: organization
        type: string
      - description: Buscar no título
        in: query
        name: search
        type: string
      - description: Filtrar por categoria
        in: query
        name: categoria_id
        type: integer
      - description: Filtrar por acessibilidade
        in: query
        name: acessibilidade_id
        type: integer
      - description: Filtrar por zona do bairro
        in: query
        name: neighborhood_zone
        type: string
      - description: 'Ordenação opcional. ''availability'': cursos com inscrição disponível
          primeiro; os sem inscrição (status final, prazo vencido ou vagas esgotadas
          — inclusive accepting_enrollments sem vagas) vão para o final. A ordenação
          é aplicada antes da paginação. Omitido = ordem padrão (id desc).'
        enum:
        - availability
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Listar cursos criados
      tags:
      - courses
  /api/public/courses/{courseId}:
    get:
      description: Retorna dados completos de um curso específico
      parameters:
      - description: ID do curso
        in: path
        name: courseId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Curso'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Buscar curso específico
      tags:
      - courses
  /api/public/empregabilidade/vagas:
    get:
      description: Retorna lista paginada de vagas publicadas. Sem filtro retorna
        todos os status públicos (publicado_ativo, publicado_expirado, vaga_congelada,
        vaga_descontinuada). Use ?status= para filtrar por um status específico.
      parameters:
      - description: 'Número da página (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Tamanho da página (default: 10)'
        in: query
        name: pageSize
        type: integer
      - description: Filtrar por status (publicado_ativo, publicado_expirado, vaga_congelada,
          vaga_descontinuada)
        in: query
        name: status
        type: string
      - description: Filtrar por data de publicação (hoje, ultima_semana, ultimo_mes)
        in: query
        name: data_publicacao
        type: string
      - description: 'UUID(s) do regime de contratação (CSV, ex: uuid1,uuid2)'
        in: query
        name: id_regime_contratacao
        type: string
      - description: 'UUID(s) do modelo de trabalho (CSV, ex: uuid1,uuid2)'
        in: query
        name: id_modelo_trabalho
        type: string
      - description: 'Nome(s) ou CNPJ(s) do contratante (CSV, ex: TechRio,12345678000100)'
        in: query
        name: contratante
        type: string
      - description: 'Acessibilidade PCD (CSV, ex: para_pcd,exclusivo_pcd)'
        in: query
        name: acessibilidade_pcd
        type: string
      - description: 'Bairro(s) — busca parcial (CSV, ex: Centro,Tijuca)'
        in: query
        name: bairro
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Listar vagas públicas
      tags:
      - empregabilidade-vagas-public
  /api/public/empregabilidade/vagas/{id}:
    get:
      description: Retorna uma vaga publicada pelo ID (publicado_ativo, publicado_expirado,
        vaga_congelada, vaga_descontinuada)
      parameters:
      - description: ID da vaga
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/empregabilidade.Vaga'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Buscar vaga pública
      tags:
      - empregabilidade-vagas-public
  /api/public/empregabilidade/vagas/slug/{slug}:
    get:
      description: Retorna uma vaga publicada pelo slug (apenas se estiver ativa).
        Slug no formato "{titulo-slugificado}-{12-chars-hex-do-uuid}". Se o slug for
        histórico (título mudou), retorna 301 redirect para o slug atual.
      parameters:
      - description: 'Slug da vaga (ex: analista-financeiro-jr-b06235c80d2a)'
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/empregabilidade.Vaga'
        "301":
          description: Moved Permanently
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Buscar vaga pública por slug
      tags:
      - empregabilidade-vagas-public
  /api/public/oportunidades-mei:
    get:
      description: Retorna uma lista paginada de oportunidades MEI ativas
      parameters:
      - description: 'Número da página (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Tamanho da página (default: 10, max: 1000)'
        in: query
        name: pageSize
        type: integer
      - description: Filtrar por órgão
        in: query
        name: orgaoId
        type: string
      - description: Filtrar por status (draft, active, expired)
        in: query
        name: status
        type: string
      - description: Buscar por título (case-insensitive)
        in: query
        name: titulo
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Listar oportunidades MEI
      tags:
      - oportunidades-mei
  /api/public/oportunidades-mei/{id}:
    get:
      description: Retorna uma oportunidade MEI pelo seu ID
      parameters:
      - description: ID da oportunidade
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.OportunidadeMEI'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
