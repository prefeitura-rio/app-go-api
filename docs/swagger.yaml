      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Excluir CNAE
      tags:
      - cnaes-admin
    put:
      consumes:
      - application/json
      description: Atualiza um CNAE existente (admin)
      parameters:
      - description: Código do CNAE
        in: path
        name: codigo
        required: true
        type: string
      - description: Dados do CNAE
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CNAE'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CNAE'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Atualizar CNAE
      tags:
      - cnaes-admin
