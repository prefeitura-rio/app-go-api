  /api/v1/categorias:
    get:
      description: Retorna lista paginada de categorias. Use onlyWithCourses=true
        para filtrar apenas categorias com cursos abertos, visíveis e com inscrições
        dentro do período de tolerância.
      parameters:
      - description: 'Número da página (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Tamanho da página (default: 10)'
        in: query
        name: pageSize
        type: integer
      - description: Filtrar apenas categorias com cursos abertos
        in: query
        name: onlyWithCourses
        type: boolean
      - description: 'Dias de tolerância após vencimento da inscrição (default: 30)'
        in: query
        name: daysTolerance
        type: integer
      - description: 'Filtrar cursos visíveis (default: true)'
        in: query
        name: isVisible
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
